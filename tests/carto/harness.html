<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif}
  #canvas{display:block;background:#fff}
  .hidden{display:none}
</style></head><body>
<!--
  Banc d'essai visuel OptiqCarto — pilote le VRAI éditeur (editor.js) sur une carto
  d'import VSDX, exécute l'agencement auto réel (_computeAutoLayout) et rend le SVG,
  pour valider chaque changement EN CAPTURE avant de pousser (cf. README.md).

  Scaffold DOM minimal : editor.js lie ses refs SVG (const gShapes = getElementById…)
  au chargement. On fournit donc #canvas + les calques AVANT les <script>. init()
  (DOMContentLoaded) échoue proprement (boutons UI absents) sans bloquer le reste.
-->
<svg id="canvas" width="1700" height="1200" xmlns="http://www.w3.org/2000/svg">
  <g id="root-group">
    <g id="g-bands"></g>
    <g id="g-legend"></g>
    <g id="g-groups"></g>
    <g id="g-connections"></g>
    <g id="g-shapes"></g>
    <g id="g-handles"></g>
    <g id="g-ui"></g>
    <g id="g-overlay"></g>
    <g id="g-lasso"></g>
  </g>
</svg>
<div id="status-zoom" class="hidden"></div>
<input id="label-editor" class="hidden">
<div id="canvas-map-list" class="hidden"></div>
<div id="multiselect-badge" class="hidden"><span id="multiselect-count"></span></div>

<script>
  window.OPTIQ_I18N = {};
  window.OPTIQCARTO_READONLY = false;
  // Sur les grosses cartos denses (ex. hard.vsdx, 243 flèches) libavoid time-out puis
  // repli sur le routeur interne : on teste directement l'interne (= ce qui ship).
  window.OPTIQCARTO_USE_LIBAVOID = false;
</script>
<script src="./jszip.min.js"></script>
<script src="/static/optiqcarto/color-utils.js"></script>
<script src="/static/optiqcarto/geometry.js"></script>
<script src="/static/optiqcarto/highlight-mode.js"></script>
<script src="/static/optiqcarto/vsdx_importer.js"></script>
<script src="/static/optiqcarto/editor.js"></script>

<script>
// ── mesures indépendantes de l'éditeur ───────────────────────────────────
function _portPoint(s, dir, t){
  t = (t==null?0.5:t);
  const h = s.type==='process' ? 7 : 0;
  if(dir==='top')    return {x:s.x+s.w*t, y:s.y-h};
  if(dir==='bottom') return {x:s.x+s.w*t, y:s.y+s.h+h};
  if(dir==='left')   return {x:s.x-h,     y:s.y+s.h*t};
  return {x:s.x+s.w+h, y:s.y+s.h*t};
}
function _segInt(a,b,c,d){
  const o=(p,q,r)=>Math.sign((q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]));
  const o1=o(a,b,c),o2=o(a,b,d),o3=o(c,d,a),o4=o(c,d,b);
  return o1!==o2&&o3!==o4&&o1!==0&&o2!==0&&o3!==0&&o4!==0;
}
// NB : reconstruit les polylignes depuis userPts (approximation du tracé rendu ; le
// rendu réel ajoute stubs/arrondis). Fiable pour compter les croisements, indicatif
// pour le reste.
function _measure(){
  const byId=new Map(state.shapes.map(s=>[s.id,s]));
  const segs=[];
  for(const c of state.connections){
    const a=byId.get(c.fromId),b=byId.get(c.toId); if(!a||!b) continue;
    const fp=_portPoint(a,c.fromPortDir||'right',c.fromPortT);
    const tp=_portPoint(b,c.toPortDir||'left',c.toPortT);
    const mids=(c.userPts||[]).map(p=>[p.x,p.y]);
    const pl=[[fp.x,fp.y],...mids,[tp.x,tp.y]];
    for(let i=0;i<pl.length-1;i++) segs.push([pl[i],pl[i+1]]);
  }
  let cross=0;
  for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++)
    if(_segInt(segs[i][0],segs[i][1],segs[j][0],segs[j][1])) cross++;
  return {cross, nSeg:segs.length};
}
// Pointes RÉELLES : reproduit le tracé rendu (_alignPortApproach sur _computedOrthopts,
// exactement comme renderConnections) et vérifie que le dernier segment suit l'axe du
// port cible. Fiable (lit la même géométrie que le SVG dessiné).
function _measureTips(){
  let pivot=0; const samples=[];
  for(const c of state.connections){
    let pts=c._computedOrthopts; if(!pts||pts.length<2) continue;
    if(typeof _alignPortApproach==='function'){
      try{ pts=_alignPortApproach(pts.slice(), c.fromPortDir, c.toPortDir); }catch(_){}
    }
    const p2=pts[pts.length-2], p1=pts[pts.length-1];
    const dx=Math.abs(p1.x-p2.x), dy=Math.abs(p1.y-p2.y);
    const dir=c.toPortDir||'left';
    const wantH=(dir==='left'||dir==='right');
    const off = wantH ? dy : dx; // écart perpendiculaire à l'axe attendu
    if(off>2 && Math.hypot(dx,dy)>0.5){ pivot++; if(samples.length<10) samples.push({id:c.id,x:Math.round(p1.x),y:Math.round(p1.y),off:Math.round(off),dir}); }
  }
  return {pivot, samples};
}
// Losanges décoratifs : combien sont bien reposés sur LEUR flèche d'origine (tag
// _seatConnId posé avant routage). Un losange taggé doit finir à ~0 px de la flèche
// routée de son connecteur — sinon il est sur la MAUVAISE flèche (le bug à traquer).
function _measureDeco(){
  const connected=new Set(); state.connections.forEach(c=>{connected.add(c.fromId);connected.add(c.toId);});
  const connById={}; state.connections.forEach(c=>connById[c.id]=c);
  const decos=state.shapes.filter(s=>s.type==='decision'&&!connected.has(s.id));
  let tagged=0, seatedOnTag=0, untagged=0; const bad=[];
  for(const D of decos){
    if(D._seatConnId==null){untagged++;continue;}
    tagged++;
    const c=connById[D._seatConnId], pts=c&&c._computedOrthopts;
    if(!pts||pts.length<2){bad.push({id:D.id,reason:'no-route'});continue;}
    const cx=D.x+D.w/2, cy=D.y+D.h/2; let m=1e9;
    for(let i=0;i<pts.length-1;i++){const d=_distSeg(cx,cy,pts[i],pts[i+1]);if(d<m)m=d;}
    if(m<=6) seatedOnTag++; else bad.push({id:D.id,dist:Math.round(m)});
  }
  return {count:decos.length, tagged, seatedOnTag, untagged, bad:bad.slice(0,8)};
}
function _distSeg(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy||1;let t=((px-a.x)*dx+(py-a.y)*dy)/L;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(a.x+t*dx),py-(a.y+t*dy));}
// Segments non droits : ni horizontaux ni verticaux (déviation perpendiculaire > tol px).
// Lit _computedOrthopts (géométrie rendue réelle). Ignore les micro-segments.
function _measureAngles(tol){
  tol=tol||2; let total=0, skew=0; const samples=[];
  for(const c of state.connections){
    const pts=c._computedOrthopts; if(!pts||pts.length<2) continue;
    for(let i=0;i<pts.length-1;i++){
      const dx=Math.abs(pts[i+1].x-pts[i].x), dy=Math.abs(pts[i+1].y-pts[i].y);
      if(dx<1&&dy<1) continue;
      total++;
      const off=Math.min(dx,dy); // écart à l'axe le plus proche
      if(off>tol){ skew++; if(samples.length<10) samples.push({id:c.id,x:Math.round(pts[i].x),y:Math.round(pts[i].y),dx:Math.round(dx),dy:Math.round(dy)}); }
    }
  }
  return {total, skew, samples};
}
// Labels : combien de flèches ont un label, combien sont posés (labelOffset), et
// combien de labels posés chevauchent le segment d'une AUTRE flèche (le défaut à éviter).
// Lit les <text> réellement rendus dans #g-connections (fidèle au SVG).
function _measureLabels(){
  const conns=state.connections.filter(c=>(c.label||'').trim());
  const withOffset=state.connections.filter(c=>c.labelOffset).length;
  // segments de toutes les flèches
  const segs=[];
  for(const c of state.connections){const p=c._computedOrthopts;if(!p||p.length<2)continue;for(let i=0;i<p.length-1;i++)segs.push({id:c.id,a:p[i],b:p[i+1]});}
  const byId=new Map(state.shapes.map(s=>[s.id,s]));
  let onOtherArrow=0;
  for(const c of conns){
    if(!c.labelOffset) continue;
    const lines=(c.label||'').split('\n');
    const lw=Math.max(24,Math.max(...lines.map(l=>l.length))*6.5+10), lh=13*lines.length+(lines.length>1?4:0);
    const horiz=(c.labelOffset.a===0); const bw=horiz?lw:lh, bh=horiz?lh:lw;
    const cx=c.labelOffset.x, cy=c.labelOffset.y, hw=bw/2, hh=bh/2;
    for(const sg of segs){ if(sg.id===c.id) continue;
      // distance du BORD de la boîte au segment (comme architectLabels)
      const abx=sg.b.x-sg.a.x, aby=sg.b.y-sg.a.y, L=abx*abx+aby*aby||1;
      const t=Math.max(0,Math.min(1,((cx-sg.a.x)*abx+(cy-sg.a.y)*aby)/L));
      const px=sg.a.x+t*abx, py=sg.a.y+t*aby;
      const bdx=Math.max(0,Math.abs(cx-px)-hw), bdy=Math.max(0,Math.abs(cy-py)-hh);
      if(Math.hypot(bdx,bdy)<3){ onOtherArrow++; break; }
    }
  }
  return {labeled:conns.length, placed:withOffset, onOtherArrow};
}
// Chevauchements : paires de segments parallèles de flèches DIFFÉRENTES qui se
// superposent (même axe, coord à ≤tol px, recouvrement >minOv). C'est le vrai signal
// « spaghetti » (des traits l'un sur l'autre), distinct des croisements (inévitables).
function _measureOverlaps(tol,minOv){
  tol=tol||4; minOv=minOv||30;
  const segs=[];
  for(const c of state.connections){const p=c._computedOrthopts;if(!p||p.length<2)continue;
    for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];
      const isH=Math.abs(a.y-b.y)<1.5,isV=Math.abs(a.x-b.x)<1.5; if(!isH&&!isV)continue;
      segs.push({id:c.id,isH,coord:isH?a.y:a.x,lo:isH?Math.min(a.x,b.x):Math.min(a.y,b.y),hi:isH?Math.max(a.x,b.x):Math.max(a.y,b.y)});
    }}
  let overlaps=0;
  for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++){
    const A=segs[i],B=segs[j]; if(A.id===B.id||A.isH!==B.isH)continue;
    if(Math.abs(A.coord-B.coord)>tol)continue;
    if(Math.min(A.hi,B.hi)-Math.max(A.lo,B.lo)>minOv) overlaps++;
  }
  return overlaps;
}
// Longueur totale des tracés rendus (px). Proxy direct du « spaghetti » : plus les
// flèches sont longues (formes éloignées), plus la vue d'ensemble est chargée.
// Points de flèche HORS des bandes (au-delà de la zone utile) — révèle les tracés qui
// « fuient » vers le vide (le bug des longues lignes verticales sous la carto).
function _measureOOB(){
  let bandTop=-200, bandBot=-200; for(const b of state.bands){ if(b.deleted)continue; bandBot+=b.height; }
  let sMinX=1e9,sMaxX=-1e9; for(const s of state.shapes){sMinX=Math.min(sMinX,s.x);sMaxX=Math.max(sMaxX,s.x+s.w);}
  const byId=new Map(state.shapes.map(s=>[s.id,s]));
  const M=80; let below=0, above=0, right=0, left=0, aYmin=1e9,aYmax=-1e9; const offenders=[];
  for(const c of state.connections){const p=c._computedOrthopts;if(!p)continue;
    let oobThis=false;
    for(const pt of p){ aYmin=Math.min(aYmin,pt.y); aYmax=Math.max(aYmax,pt.y);
      if(pt.y>bandBot+M){below++;oobThis=true;} else if(pt.y<bandTop-M){above++;oobThis=true;}
      if(pt.x>sMaxX+M){right++;} else if(pt.x<sMinX-M){left++;}
    }
    if(oobThis && offenders.length<10){
      const a=byId.get(c.fromId), b=byId.get(c.toId);
      const cpY=(c.customPath||[]).map(q=>Math.round(q.y));
      offenders.push({id:c.id, fromY:a?Math.round(a.y+a.h/2):null, toY:b?Math.round(b.y+b.h/2):null,
        pathY:p.map(q=>Math.round(q.y)), cpY, nUser:(c.userPts||[]).length});
    }
  }
  return {bandTop,bandBot,arrowYmin:Math.round(aYmin),arrowYmax:Math.round(aYmax),below,above,right,left,offenders};
}
// Extrémités de flèche qui atterrissent DANS LE VIDE (loin de toute forme) — révèle les
// flèches qui « pointent nulle part » (ex. connectées au bord vide d'un groupe conteneur).
function _measureVoidEnds(thresh){
  thresh=thresh||35; const shapes=state.shapes;
  const dToShapes=(x,y)=>{let m=1e9;for(const s of shapes){const dx=Math.max(s.x-x,0,x-(s.x+s.w)),dy=Math.max(s.y-y,0,y-(s.y+s.h));m=Math.min(m,Math.hypot(dx,dy));if(m===0)break;}return m;};
  let n=0;
  for(const c of state.connections){const p=c._computedOrthopts;if(!p||p.length<2)continue;
    if(dToShapes(p[0].x,p[0].y)>thresh)n++; if(dToShapes(p[p.length-1].x,p[p.length-1].y)>thresh)n++; }
  return n;
}
function _measureLength(){
  let total=0;
  for(const c of state.connections){const p=c._computedOrthopts;if(!p||p.length<2)continue;
    for(let i=0;i<p.length-1;i++) total+=Math.abs(p[i+1].x-p[i].x)+Math.abs(p[i+1].y-p[i].y);}
  return Math.round(total);
}
// ── cadrage + capture ─────────────────────────────────────────────────────
function _fitCanvas(maxW){
  maxW = maxW||1700;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9,y=-200;
  for(const bnd of state.bands){ if(bnd.deleted)continue; minY=Math.min(minY,y); maxY=Math.max(maxY,y+bnd.height); y+=bnd.height; }
  for(const s of state.shapes){minX=Math.min(minX,s.x);minY=Math.min(minY,s.y);maxX=Math.max(maxX,s.x+s.w);maxY=Math.max(maxY,s.y+s.h);}
  const pad=60; minX-=pad;minY-=pad;maxX+=pad;maxY+=pad;
  const W=maxX-minX,H=maxY-minY,scale=Math.min(1,maxW/W);
  const cv=document.getElementById('canvas');
  cv.setAttribute('width',Math.round(W*scale)); cv.setAttribute('height',Math.round(H*scale));
  document.getElementById('root-group').setAttribute('transform',`scale(${scale}) translate(${-minX},${-minY})`);
  return {W:Math.round(W),H:Math.round(H),scale:+scale.toFixed(3)};
}
function _fitRegion(cx,cy,zw,zh){
  const maxPx=1400,scale=Math.min(maxPx/zw,maxPx/zh),cv=document.getElementById('canvas');
  cv.setAttribute('width',Math.round(zw*scale)); cv.setAttribute('height',Math.round(zh*scale));
  document.getElementById('root-group').setAttribute('transform',`scale(${scale}) translate(${-(cx-zw/2)},${-(cy-zh/2)})`);
  return {region:{cx,cy,zw,zh},scale:+scale.toFixed(3)};
}

async function run(){
  const q=new URLSearchParams(location.search);
  const vsdx = q.get('vsdx') || '/Code/hard.vsdx';   // carto de référence par défaut
  const classic = q.get('classic')==='1';             // reconstruction classique (fidèle Visio)
  const fix = q.get('fix')==='1';                      // applique le correctif classique (angles+labels)
  const declutter = q.get('declutter')!=='0';         // aération (align+declutter) on/off
  const route = q.get('route')!=='0' && !classic;     // agencement auto on/off (positions brutes)
  const buf=await (await fetch(vsdx)).arrayBuffer();
  const res=await vsdxParse(new Blob([buf]),()=>{},async()=>'keep',{spliceDecisions:false});
  state.bands=res.bands; state.shapes=res.shapes; state.connections=res.connections;
  state.groups=res.groups||[]; state.showBands=true;
  state.connections.forEach(c=>{const f=state.shapes.find(s=>s.id===c.fromId); if(f)c.color=f.color;});
  render();
  const before=_measure();
  if(classic){
    // Tracés Visio exacts SAUF détours aberrants (hors carto OU loin hors boîte des
    // deux extrémités) → route propre (userPts=null). Cf. editor.js même logique.
    let bTop=-200,bBot=-200; for(const b of state.bands) if(!b.deleted) bBot+=b.height;
    let sxLo=Infinity,sxHi=-Infinity; for(const s of state.shapes){sxLo=Math.min(sxLo,s.x);sxHi=Math.max(sxHi,s.x+s.w);}
    const OOB=50, DET=180, byId={}; for(const s of state.shapes) byId[s.id]=s;
    for(const c of state.connections){ if(!c.customPath||c.customPath.length<3) continue;
      const mids=c.customPath.slice(1,-1), a=byId[c.fromId], b=byId[c.toId];
      let exLo=-1e9,exHi=1e9,eyLo=-1e9,eyHi=1e9;
      if(a&&b){exLo=Math.min(a.x,b.x)-DET;exHi=Math.max(a.x+a.w,b.x+b.w)+DET;eyLo=Math.min(a.y,b.y)-DET;eyHi=Math.max(a.y+a.h,b.y+b.h)+DET;}
      const bad=mids.some(p=>p.y>bBot+OOB||p.y<bTop-OOB||p.x<sxLo-OOB||p.x>sxHi+OOB||p.x<exLo||p.x>exHi||p.y<eyLo||p.y>eyHi);
      c.userPts=bad?null:mids; }
    render();
    if(fix && typeof _reconstructClassicPolish==='function') _reconstructClassicPolish();
    const lp=q.get('labelpos'); // test du curseur global de labels (0..100)
    if(lp!=null && typeof setLabelsAlongArrows==='function') setLabelsAlongArrows(+lp/100);
    render();
  } else if(route){
    await _computeAutoLayout({declutter});
  }
  const after=_measure();
  const cx=q.get('cx'),cy=q.get('cy'),zw=q.get('zw');
  const fit=(cx!=null&&cy!=null&&zw!=null) ? _fitRegion(+cx,+cy,+zw,+(q.get('zh')||zw)) : _fitCanvas(1700);
  render();
  const tips=route?_measureTips():{pivot:0,samples:[]};
  const deco=route?_measureDeco():{tagged:0,seatedOnTag:0,untagged:0};
  const angles=_measureAngles();
  const labels=_measureLabels();
  const overlaps=_measureOverlaps();
  const length=_measureLength();
  const oob=_measureOOB();
  const voidEnds=_measureVoidEnds();
  window.__R__={vsdx, mode:{classic,fix,declutter,route}, before, after, tips, deco, angles, labels, overlaps, length, oob:{below:oob.below,above:oob.above,right:oob.right,left:oob.left}, voidEnds, fit, nbShapes:state.shapes.length, nbConns:state.connections.length};
  document.title='DONE';
}
run().catch(e=>{window.__R__={err:String(e&&e.stack||e)};document.title='DONE';});
</script>
</body></html>
