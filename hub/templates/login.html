<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optiq Hub — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='hub.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23101725'/><circle cx='16' cy='16' r='8' fill='none' stroke='%230d9488' stroke-width='4'/></svg>">
</head>
<body class="page--accueil">
<div class="fond" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="page-login">
  <form class="boite-login" method="post" autocomplete="on">
    <div class="boite-login-tete">
      <div class="rail-marque">
        <span class="rail-logo"></span>
        <span><strong>Optiq</strong> <span>Hub</span></span>
      </div>
      <h1>Accès réservé</h1>
      <p class="sous">Instances, bases et secrets internes.</p>
    </div>
    {% if erreur %}<div class="erreur">{{ erreur }}</div>{% endif %}
    <input type="hidden" name="suite" value="{{ suite }}">
    <div class="champ">
      <label for="username">Identifiant</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="champ">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn-login" type="submit">Entrer</button>
  </form>
</div>
</body>
</html>
