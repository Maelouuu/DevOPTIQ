name: Deploy → Version officielle

# `nouveau-point` est la version officielle interne AFDEC, servie par le service
# Cloud Run `devoptiq`. Sans ce workflow la branche avançait sans que l'instance
# bouge : elle a tourné sur le code de mai 2026 pendant des mois.
#
# ⚠️ Un seul chemin de déploiement par service. `deploy-production.yml` visait le
# MÊME service depuis `prod-stable` (figée au 07/05/2026, pré-OptiqCarto) : son
# déclenchement automatique a été retiré, sinon un push là-bas ramènerait la
# version officielle quatre mois en arrière.

on:
  push:
    branches: [nouveau-point]
  workflow_dispatch:

# Deux pushes rapprochés déployaient dans l'ordre d'arrivée des builds, pas dans
# celui des commits : la version officielle pouvait finir sur l'avant-dernière.
concurrency:
  group: deploy-officielle
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  SERVICE: devoptiq
  IMAGE: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/devoptiq/devoptiq

jobs:
  deploy:
    name: Build & Deploy (Version officielle)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # requis pour Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le Dockerfile (durci OptiqFluent) refuse de builder sans le bundle de
      # prompts chiffré — le catalogue en clair est exclu de l'image. Même
      # étape que deploy-staging.yml, même secret PROMPTS_KEY.
      - name: Chiffrer les prompts IA (prompts.enc requis par le Dockerfile)
        env:
          PROMPTS_KEY: ${{ secrets.PROMPTS_KEY }}
        run: |
          test -n "$PROMPTS_KEY" || {
            echo "::error::Secret PROMPTS_KEY manquant (Settings → Secrets → Actions)";
            exit 1;
          }
          pip install --quiet cryptography
          python tools/prompts/encrypt_prompts.py > /dev/null
          echo "Bundle prompts.enc généré"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      # Pas de WITH_TESTS ici (défaut 0) : le panel de tests est le rôle de
      # staging. Sur la version officielle il coûterait deux minutes de CPU à
      # chaque appel anonyme — /testpanel n'a aucune authentification.
      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run (Version officielle)
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" \
            --set-env-vars "SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}" \
            --set-env-vars "FLASK_ENV=production" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}" \
            --set-env-vars "REQUIRE_LICENSE=0" \
            --set-env-vars "PROMPTS_KEY=${{ secrets.PROMPTS_KEY }}" \
            --memory 2Gi \
            --timeout 120 \
            --quiet

      - name: Print URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} --format 'value(status.url)')
          echo "✅ Version officielle déployée : $URL"
