name: Deploy → OptiqPulse (optiq-pulse)

# Dashboard privé de suivi des utilisateurs (pulse/ — service séparé de
# l'app). Déployé sur son propre service Cloud Run, accessible uniquement
# via le compte unique (voir pulse/README.md). Les bases suivies sont
# composées depuis les secrets : PILOT_DATABASE_URL (base pilote) +
# PULSE_EXTRA_DBS (JSON [{name,url},…] optionnel pour d'autres instances).

on:
  push:
    branches: [optiqfluent-beta-test]
    paths:
      - 'pulse/**'
      - '.github/workflows/deploy-pulse.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  SERVICE: optiq-pulse
  IMAGE: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/optiq-pulse

jobs:
  deploy:
    name: Build & Deploy (OptiqPulse)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # requis pour Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build & push image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest pulse/
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # Bases suivies → PULSE_DBS_B64 (base64 : aucune fuite dans les logs,
      # aucun souci d'escaping gcloud avec les URLs qui contiennent @ , =).
      # Sources, dédupliquées par URL :
      #   1. les 3 secrets connus (Pilote / Staging / Production) ;
      #   2. DÉCOUVERTE AUTO : tout service Cloud Run du projet portant une
      #      DATABASE_URL — une nouvelle branche déployée est suivie au
      #      prochain déploiement pulse, sans nouveau secret ;
      #   3. PULSE_EXTRA_DBS (JSON [{name,url},…]) pour des bases hors GCP.
      - name: Composer la liste des bases suivies
        env:
          PILOT_DATABASE_URL: ${{ secrets.PILOT_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PULSE_EXTRA_DBS: ${{ secrets.PULSE_EXTRA_DBS }}
        run: |
          gcloud run services list --region ${{ env.REGION }} --format=json \
            > /tmp/services.json 2>/dev/null || echo "[]" > /tmp/services.json
          # Seul KEY=VALUE va dans GITHUB_ENV — le notice part sur stdout
          # (noms uniquement, jamais les URLs).
          python3 - <<'PY'
          import base64, json, os

          def clean(u):
              return (u or "").strip().strip('"').strip("'").strip()

          dbs, seen = [], set()

          def add(name, url):
              url = clean(url)
              if url and url not in seen:
                  seen.add(url)
                  dbs.append({"name": name, "url": url})

          LABELS = {"optiqfluent-staging": "Pilote ARaymond",
                    "devoptiq-staging": "Staging",
                    "devoptiq": "Production"}
          add("Pilote ARaymond", os.environ.get("PILOT_DATABASE_URL"))
          add("Staging", os.environ.get("STAGING_DATABASE_URL"))
          add("Production", os.environ.get("PROD_DATABASE_URL"))
          try:
              services = json.load(open("/tmp/services.json"))
          except Exception:
              services = []
          for svc in services:
              try:
                  name = svc["metadata"]["name"]
                  if name == "optiq-pulse":
                      continue
                  envs = (svc["spec"]["template"]["spec"]["containers"][0]
                          .get("env") or [])
                  url = next((e.get("value") for e in envs
                              if e.get("name") == "DATABASE_URL"), None)
                  add(LABELS.get(name, name), url)
              except Exception:
                  continue
          extra = clean(os.environ.get("PULSE_EXTRA_DBS"))
          if extra:
              for it in json.loads(extra):
                  add(it.get("name") or "Instance", it.get("url"))
          # MASQUAGE OBLIGATOIRE : GitHub affiche les variables d'étape
          # (dont celles issues de GITHUB_ENV) dans l'en-tête des étapes
          # suivantes — et le dépôt est PUBLIC. Une URL venue de la
          # découverte gcloud n'est PAS un secret du run, elle ne serait
          # pas masquée automatiquement (fuite constatée au run #5).
          b64 = base64.b64encode(json.dumps(dbs).encode()).decode()
          for d in dbs:
              print(f"::add-mask::{d['url']}")
          print(f"::add-mask::{b64}")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("PULSE_DBS_B64=" + b64 + "\n")
          noms = ", ".join(d["name"] for d in dbs) or "aucune"
          print(f"::notice::{len(dbs)} base(s) suivie(s) : {noms}")
          PY

      # Clé de session stable entre déploiements : secret GitHub si présent,
      # sinon celle déjà posée sur le service, sinon générée (1er déploiement).
      - name: Clé de session
        env:
          SECRET_PULSE_KEY: ${{ secrets.PULSE_SECRET_KEY }}
        run: |
          KEY="$SECRET_PULSE_KEY"
          if [ -z "$KEY" ]; then
            KEY=$(gcloud run services describe ${{ env.SERVICE }} \
                --region ${{ env.REGION }} --format=json 2>/dev/null \
              | python3 -c "import json,sys
          try:
              svc = json.load(sys.stdin)
              envs = svc['spec']['template']['spec']['containers'][0].get('env', [])
              print(next((e['value'] for e in envs if e['name'] == 'PULSE_SECRET_KEY'), ''))
          except Exception:
              print('')" || true)
          fi
          if [ -z "$KEY" ]; then
            KEY=$(openssl rand -hex 32)
            echo "Clé de session générée (1er déploiement)"
          fi
          echo "::add-mask::$KEY"
          echo "PULSE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run (optiq-pulse)
        env:
          SECRET_PULSE_PASSWORD: ${{ secrets.PULSE_PASSWORD }}
        run: |
          # Délimiteur ^##^ : les URLs Neon contiennent @ : , (jamais ##).
          VARS="PULSE_DBS_B64=${PULSE_DBS_B64}##PULSE_SECRET_KEY=${PULSE_KEY}"
          if [ -n "$SECRET_PULSE_PASSWORD" ]; then
            VARS="${VARS}##PULSE_PASSWORD=${SECRET_PULSE_PASSWORD}"
          fi
          if ! gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi --cpu 1 --max-instances 2 \
            --update-env-vars "^##^${VARS}" \
            --quiet; then
            echo "=== ÉCHEC DU DÉPLOIEMENT — logs récents du service ==="
            gcloud logging read \
              "resource.type=cloud_run_revision AND resource.labels.service_name=${{ env.SERVICE }}" \
              --project "${{ env.PROJECT_ID }}" --freshness 15m --limit 100 \
              --order desc --format 'value(timestamp,severity,textPayload)' || true
            exit 1
          fi

      - name: Smoke test
        env:
          SECRET_PULSE_PASSWORD: ${{ secrets.PULSE_PASSWORD }}
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} --format='value(status.url)')
          echo "OptiqPulse : $URL"
          # /health et PAS /healthz : ce dernier est intercepté par le
          # frontend Google sur *.run.app (404 avant le conteneur — constaté
          # aux runs #2/#3). || exit : sous set -e, l'échec du membre gauche
          # d'un && ne stoppe pas le job.
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$URL/health" \
            || { echo "::error::health KO"; exit 1; }
          echo " ← health OK"
          PW="${SECRET_PULSE_PASSWORD:-testtest}"
          LOC=$(curl -sS -o /dev/null -w '%{redirect_url}' \
            --data-urlencode 'username=Mael_Girardin' \
            --data-urlencode "password=$PW" "$URL/login")
          case "$LOC" in
            */) echo " ← login OptiqPulse OK" ;;
            *) echo "::error::Login OptiqPulse impossible"; exit 1 ;;
          esac
