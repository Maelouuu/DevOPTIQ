name: Deploy → Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1                        # ← adapte si besoin
  SERVICE_STAGING: devoptiq-staging           # ← nom du service Cloud Run staging
  IMAGE: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/devoptiq/devoptiq-staging

jobs:
  deploy:
    name: Build & Deploy (Staging)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # requis pour Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le Dockerfile (durci OptiqFluent) refuse de builder sans le bundle de
      # prompts chiffré — le catalogue en clair est exclu de l'image. Même
      # étape que client-image.yml, même secret PROMPTS_KEY.
      - name: Chiffrer les prompts IA (prompts.enc requis par le Dockerfile)
        env:
          PROMPTS_KEY: ${{ secrets.PROMPTS_KEY }}
        run: |
          test -n "$PROMPTS_KEY" || {
            echo "::error::Secret PROMPTS_KEY manquant (Settings → Secrets → Actions)";
            exit 1;
          }
          pip install --quiet cryptography
          python tools/prompts/encrypt_prompts.py > /dev/null
          echo "Bundle prompts.enc généré"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      # WITH_TESTS=1 : staging est notre instance de qualité — elle embarque la
      # suite pour que /testpanel (et le module Panel du hub) puisse la recenser
      # et la rejouer. L'image client garde le défaut 0.
      - name: Build Docker image
        run: |
          docker build --build-arg WITH_TESTS=1 \
            -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # --no-cpu-throttling : la suite tourne dans un sous-processus lancé APRÈS
      # la réponse HTTP. Sans CPU alloué en continu, Cloud Run l'étrangle à ~5 %
      # dès que la requête est close et une exécution de 3 min en prend 60.
      # Contrepartie : le CPU est facturé tant qu'une instance vit (staging
      # redescend quand même à zéro faute de trafic).
      - name: Deploy to Cloud Run (Staging)
        run: |
          gcloud run deploy ${{ env.SERVICE_STAGING }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" \
            --set-env-vars "SECRET_KEY=${{ secrets.STAGING_SECRET_KEY }}" \
            --set-env-vars "FLASK_ENV=staging" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}" \
            --set-env-vars "REQUIRE_LICENSE=0" \
            --set-env-vars "TESTPANEL_ENABLED=1" \
            --set-env-vars "PROMPTS_KEY=${{ secrets.PROMPTS_KEY }}" \
            --cpu 2 \
            --memory 4Gi \
            --timeout 900 \
            --no-cpu-throttling \
            --quiet

      - name: Print staging URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_STAGING }} \
            --region ${{ env.REGION }} --format 'value(status.url)')
          echo "✅ Staging déployé : $URL"
