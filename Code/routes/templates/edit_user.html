{% include "header_buttons.html" %}
<link rel="stylesheet" href="{{ url_for('static', filename='gestion_compte_new.css') }}">

<div class="accounts-page">

  <!-- ── Banner ── -->
  <div class="page-banner">
    <div class="page-banner__icon">
      <i class="fa-solid fa-user-pen"></i>
    </div>
    <div class="page-banner__text">
      <h1 class="page-banner__title">Edit User</h1>
      <p class="page-banner__sub">{{ user.first_name }} {{ user.last_name }}</p>
    </div>
  </div>

  <!-- ── Formulaire ── -->
  <section class="section-card" style="max-width: 680px; margin: 0 auto;">
    <div class="section-card__head">
      <div class="section-card__head-left">
        <span class="section-icon"><i class="fa-solid fa-pencil"></i></span>
        <div>
          <h2 class="section-card__title">Account Information</h2>
          <p class="section-card__subtitle">Update the fields and save</p>
        </div>
      </div>
    </div>

    <form method="POST">
      <div class="create-grid">

        <div class="field">
          <div class="search-style-wrap">
            <i class="fa-solid fa-user search-style-icon"></i>
            <input type="text" name="first_name" class="search-style-input"
                   placeholder="First name *" value="{{ user.first_name }}" required autocomplete="off">
          </div>
        </div>

        <div class="field">
          <div class="search-style-wrap">
            <i class="fa-solid fa-user search-style-icon"></i>
            <input type="text" name="last_name" class="search-style-input"
                   placeholder="Last name *" value="{{ user.last_name }}" required autocomplete="off">
          </div>
        </div>

        <div class="field">
          <div class="search-style-wrap">
            <i class="fa-solid fa-envelope search-style-icon"></i>
            <input type="email" name="email" class="search-style-input"
                   placeholder="Email *" value="{{ user.email }}" required autocomplete="off">
          </div>
        </div>

        <div class="field">
          <div class="search-style-wrap">
            <i class="fa-solid fa-calendar search-style-icon"></i>
            <input type="number" name="age" class="search-style-input"
                   placeholder="Age" value="{{ user.age or '' }}" min="18" max="100" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <div class="search-style-wrap search-style-wrap--select">
            <i class="fa-solid fa-briefcase search-style-icon"></i>
            <select name="role_id" class="search-style-input" required>
              {% for role in roles %}
                <option value="{{ role.id }}" {% if current_role and current_role.role_id == role.id %}selected{% endif %}>{{ role.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="field">
          <div class="search-style-wrap search-style-wrap--select">
            <i class="fa-solid fa-shield search-style-icon"></i>
            <select name="status" class="search-style-input" required>
              <option value="user"          {% if user.status == 'user' %}selected{% endif %}>User</option>
              <option value="rh"            {% if user.status == 'rh' %}selected{% endif %}>HR</option>
              <option value="administrateur"{% if user.status == 'administrateur' %}selected{% endif %}>Administrator</option>
            </select>
          </div>
        </div>

        <div class="field-btn" style="gap: 10px; display: flex; justify-content: flex-end;">
          <a href="{{ url_for('gestion_compte.list_users') }}" class="btn btn-ghost">
            <i class="fa-solid fa-xmark"></i> Cancel
          </a>
          <button type="submit" class="btn btn-pink">
            <i class="fa-solid fa-check"></i> Save
          </button>
        </div>

      </div>
    </form>
  </section>

  <!-- ── Changer le mot de passe (section séparée, sans risque d'autofill) ── -->
  <section class="section-card" style="max-width: 680px; margin: 24px auto 0;">
    <div class="section-card__head">
      <div class="section-card__head-left">
        <span class="section-icon"><i class="fa-solid fa-lock"></i></span>
        <div>
          <h2 class="section-card__title">Change Password</h2>
          <p class="section-card__subtitle">Leave blank if no change needed</p>
        </div>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px; padding:4px 0 8px;">
      <div class="search-style-wrap">
        <i class="fa-solid fa-lock search-style-icon"></i>
        <input type="password" id="chpw-new" class="search-style-input"
               placeholder="New password (min. 6 chars)"
               autocomplete="new-password">
      </div>
      <div class="search-style-wrap">
        <i class="fa-solid fa-lock search-style-icon"></i>
        <input type="password" id="chpw-confirm" class="search-style-input"
               placeholder="Confirm new password"
               autocomplete="new-password">
      </div>
      <div id="chpw-msg" style="font-size:0.84rem; min-height:20px;"></div>
      <div style="display:flex; justify-content:flex-end;">
        <button type="button" class="btn btn-pink" onclick="submitPasswordChange()">
          <i class="fa-solid fa-key"></i> Update Password
        </button>
      </div>
    </div>
  </section>

  <script>
  function submitPasswordChange() {
    const newPw   = document.getElementById('chpw-new').value;
    const confirm = document.getElementById('chpw-confirm').value;
    const msg     = document.getElementById('chpw-msg');

    if (!newPw) { msg.innerHTML = '<span style="color:#dc2626">Please enter a new password.</span>'; return; }
    if (newPw.length < 6) { msg.innerHTML = '<span style="color:#dc2626">Minimum 6 characters.</span>'; return; }
    if (newPw !== confirm) { msg.innerHTML = '<span style="color:#dc2626">Passwords do not match.</span>'; return; }

    msg.innerHTML = '<span style="color:#6b7280"><i class="fa-solid fa-spinner fa-spin"></i> Saving…</span>';
    fetch('/comptes/set_password/{{ user.id }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: newPw })
    })
    .then(r => r.json())
    .then(d => {
      if (d.ok) {
        msg.innerHTML = '<span style="color:#16a34a"><i class="fa-solid fa-check"></i> Password updated successfully.</span>';
        document.getElementById('chpw-new').value = '';
        document.getElementById('chpw-confirm').value = '';
      } else {
        msg.innerHTML = `<span style="color:#dc2626"><i class="fa-solid fa-triangle-exclamation"></i> ${d.error || 'Error'}</span>`;
      }
    })
    .catch(() => { msg.innerHTML = '<span style="color:#dc2626">Network error.</span>'; });
  }
  </script>

</div>
