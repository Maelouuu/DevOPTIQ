<!DOCTYPE html>
<html lang="{{ lang or 'fr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPTIQ — {{ t('page.competences') }}</title>
  {# ⚠️ Le lien reste ICI, dans le <head>, à la place qu'occupait le <style> en
     ligne : `header_buttons.html` charge optiq.css et ui-theme.css depuis le
     <body>, donc APRÈS. Déplacer ce lien change la cascade. #}
  <link rel="stylesheet" href="{{ url_for('static', filename='competences.css') }}">
</head>
<body data-lang="{{ lang or 'fr' }}" class="pg page--competences">
  <header>{% include 'header_buttons.html' %}</header>

  <div class="pg-container">
    {% with banner_page='competences', banner_icon='fa-solid fa-layer-group',
            banner_title='Compétences',
            banner_sub=t('comp.select_collab_start') %}
      {% include "page_banner.html" %}
    {% endwith %}
    <script>
      /* Relie le bandeau commun à l'i18n client de competences_v2.js :
         le titre suit la clé `title`, le sous-titre (id cv2-sub) la clé
         `pick_collab` puis affiche le collaborateur sélectionné. */
      (function () {
        var t = document.querySelector('.page-banner__title');
        if (t) t.setAttribute('data-i18n', 'title');
        var s = document.querySelector('.page-banner__sub');
        if (s) { s.id = 'cv2-sub'; s.setAttribute('data-i18n', 'pick_collab'); }
      })();
    </script>

    {# Le CALENDRIER PARTAGÉ — les séances d'évaluation et les créneaux des
       activités sur une même grille. ⚠️ `?de=comp` : on y arrive avec les
       seules données de compétences allumées, puisqu'on vient d'ici.
       ⚠️ `calendrier_ouvert` est le MÊME verdict que la route : un bouton ne
       doit jamais mener à un écran qui refuse. #}
    {% if calendrier_ouvert %}
    <div class="cv2-vers-cal">
      <a href="/calendrier/?de=comp" title="{{ t('cal.ouvrir_aide') }}">
        <i class="fa-regular fa-calendar-days"></i>{{ t('cal.ouvrir') }}
      </a>
    </div>
    {% endif %}

    <div class="cv2-layout">
      <aside class="cv2-sidebar">
        <div class="cv2-mgr">
          <span class="mav" id="cv2-mgr-av">—</span>
          <div>
            <span class="lbl" id="cv2-mgr-lbl" data-i18n="manager">Développeur de compétences</span>
            <span class="nm" id="cv2-mgr-name">—</span>
          </div>
        </div>
        <div class="cv2-sec-title" id="cv2-collab-title" data-i18n="collaborators">Collaborateurs</div>
        <ul class="cv2-collab" id="cv2-collab"></ul>
        <p class="cv2-empty-side hidden" id="cv2-collab-empty" data-i18n="no_collab">Aucun collaborateur.</p>
      </aside>

      <main class="cv2-main">
        {# ── Écran 1 : la synthèse ────────────────────────────────────────
           On entrait directement dans le détail d'un rôle. Où en est la
           personne, tous rôles confondus, ne se voyait nulle part. #}
        <section class="cv2-ecran hidden" id="cv2-ecran-synthese">
          <div class="cv2-bilan" id="cv2-bilan"></div>
          {# Le profil : ce que la vue d'ensemble apporte de plus que la somme
             des cartes — la forme de ce que la personne tient, face à ce que
             ses rôles exigent. #}
          <div class="cv2-profil hidden" id="cv2-profil"></div>
          {# Ce qui ATTEND la personne — la vue d'ensemble disait où elle en
             est, jamais ce qui vient. #}
          <div class="cv2-seances hidden" id="cv2-seances"></div>
          {# ⚠️ Les cartes de rôle du bas REDISAIENT la liste « par rôle »
             posée à côté du radar : même liste, même ordre, même geste (un
             clic ouvre le rôle). Elles portaient en plus les compteurs et le
             bouton du plan — tous deux présents sur la page d'évaluation,
             celle-là même qu'un clic ouvre. Il ne reste que l'état vide :
             sans lui, quelqu'un sans aucun rôle n'aurait rien du tout. #}
          <div class="cv2-vide hidden" id="cv2-sans-role"></div>
        </section>


        <div class="cv2-placeholder" id="cv2-placeholder" data-i18n="pick_collab2">Sélectionnez un collaborateur puis un rôle.</div>
      </main>
    </div>

    {# ── Écrans 3 et 4 : des PAGES, pas des tiroirs ───────────────────
       Évaluer demande une échelle de paliers, un graphe et un historique.
       Le tiroir fait 720 px — et `body.pg` porte `zoom: .8`, donc 576 px
       réels : tout y était comprimé. Ces deux sections vivent HORS de
       `.cv2-layout` pour prendre toute la largeur, et la barre latérale
       des collaborateurs s'efface quand elles s'ouvrent. #}
    <section class="cv2-page hidden" id="cv2-ecran-eval"></section>
    <section class="cv2-page hidden" id="cv2-ecran-seance"></section>
    <section class="cv2-page hidden" id="cv2-ecran-cal"></section>
  </div>

  <div class="cv2-overlay" id="cv2-overlay"></div>

  {# Fenêtre d'évaluation #}
  <aside class="cv2-drawer" id="cv2-drawer" role="dialog" aria-modal="true">
    <div class="cv2-dh">
      <button class="x" id="cv2-drawer-close" aria-label="{{ t('btn.close') }}">&times;</button>
      <h2 id="cv2-drawer-title">—</h2>
      <div class="cv2-sub" id="cv2-drawer-role"></div>
    </div>
    <div class="cv2-db" id="cv2-drawer-body"></div>
    <div class="cv2-df" id="cv2-footer"></div>
  </aside>

  {# Fenêtre du plan de formation — séparée : on n'évalue pas et on ne
     planifie pas dans le même écran. #}
  <aside class="cv2-plan-win" id="cv2-plan-win" role="dialog" aria-modal="true">
    <div class="cv2-ph">
      <button class="x" id="cv2-plan-close" aria-label="{{ t('btn.close') }}">&times;</button>
      <h2 data-i18n="plan_title">Plan de formation</h2>
      <div class="cv2-sub" id="cv2-plan-sub"></div>
    </div>
    <div class="cv2-pb" id="cv2-plan-body"></div>
    <div class="cv2-df" id="cv2-plan-footer"></div>
  </aside>

  {# Fenêtre des courbes — DEUX schémas pour une même progression : les
     niveaux (une ligne par sortie, de 0 à 4) et les valeurs (le relief d'une
     sortie mesurée, dans son unité). Elles vivaient toutes deux dans l'écran
     où l'on note, l'une sous l'autre : deux sections de graphes mêlées à la
     notation. Le détail des séances les accompagne — la feuille dit l'ÉTAT,
     cette fenêtre dit l'HISTOIRE. #}
  <aside class="cv2-crb-win" id="cv2-crb-win" role="dialog" aria-modal="true">
    <div class="cv2-ph">
      <button class="x" id="cv2-crb-close" aria-label="{{ t('btn.close') }}">&times;</button>
      <h2 data-i18n="crb_titre">Les courbes</h2>
      <div class="cv2-sub" id="cv2-crb-sub"></div>
    </div>
    <div class="crb-ong" id="cv2-crb-ong"></div>
    <div class="cv2-pb" id="cv2-crb-body"></div>
  </aside>


  <div class="cv2-toast" id="cv2-toast"></div>

  <script>window.OPTIQ_LANG = document.body.dataset.lang || 'fr';</script>
  <script src="/static/js/competences_v2.js"></script>
</body>
</html>
