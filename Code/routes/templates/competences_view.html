<!DOCTYPE html>
<html lang="{{ lang or 'fr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPTIQ — Compétences</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    :root{
      --pink:#ec4899; --pink-dark:#be185d; --pink-dim:#fdf2f8;
      --green:#22c55e; --green-dark:#16a34a;
      --ink:#1f2430; --muted:#7a8194; --line:#e8eaf0; --bg:#f6f7fb; --card:#fff;
      --red:#ef4444; --orange:#f59e0b; --grey:#c3c8d4;
      --radius:14px; --shadow:0 1px 3px rgba(20,25,40,.06),0 8px 30px rgba(20,25,40,.06);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
    header{position:sticky;top:0;z-index:30}
    .cv2-layout{display:flex;min-height:calc(100vh - 0px)}
    /* Sidebar */
    .cv2-sidebar{width:264px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:18px 14px;min-height:100vh}
    .cv2-mgr{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--pink-dim);border-radius:12px;margin-bottom:16px}
    .cv2-mgr .dot{width:9px;height:9px;border-radius:50%;background:var(--pink)}
    .cv2-mgr .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:block}
    .cv2-mgr .nm{font-weight:700;font-size:13px}
    .cv2-sec-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 6px 10px}
    .cv2-collab{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
    .cv2-collab li{padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:9px;transition:background .12s}
    .cv2-collab li:hover{background:var(--pink-dim)}
    .cv2-collab li.active{background:var(--pink);color:#fff}
    .cv2-collab li .av{width:26px;height:26px;border-radius:50%;background:#eef0f6;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted)}
    .cv2-collab li.active .av{background:rgba(255,255,255,.25);color:#fff}
    .cv2-empty-side{font-size:12px;color:var(--muted);padding:10px 6px}
    /* Main */
    .cv2-main{flex:1;padding:26px 30px;min-width:0}
    .cv2-h1{font-size:22px;font-weight:700;margin:0}
    .cv2-sub{color:var(--muted);margin:3px 0 18px}
    .cv2-roles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
    .cv2-role{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;color:var(--muted)}
    .cv2-role.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .cv2-placeholder{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:46px;text-align:center;color:var(--muted)}
    /* Table */
    .cv2-tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
    table.cv2-tab{width:100%;border-collapse:collapse}
    .cv2-tab th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700}
    .cv2-tab td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
    .cv2-tab tr:last-child td{border-bottom:none}
    .cv2-tab tr:hover td{background:#fafbff}
    .cv2-actname{font-weight:700}
    .cv2-actcomp{font-size:12px;color:var(--muted);margin-top:2px;max-width:340px}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:700;font-size:12.5px}
    .chip .lv{width:8px;height:8px;border-radius:50%}
    .chip.grey{background:#f1f2f6;color:#6b7280}.chip.grey .lv{background:var(--grey)}
    .chip.red{background:#fef2f2;color:#b91c1c}.chip.red .lv{background:var(--red)}
    .chip.orange{background:#fffbeb;color:#b45309}.chip.orange .lv{background:var(--orange)}
    .chip.green{background:#f0fdf4;color:#15803d}.chip.green .lv{background:var(--green)}
    .gap-pos{color:var(--green-dark);font-weight:700}.gap-neg{color:var(--red);font-weight:700}.gap-zero{color:var(--muted)}
    .btn{border:none;border-radius:9px;padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit}
    .btn-primary{background:var(--pink);color:#fff}.btn-primary:hover{background:var(--pink-dark)}
    .btn-ghost{background:#f2f3f8;color:var(--ink)}.btn-ghost:hover{background:#e7e9f2}
    .btn-sm{padding:6px 11px;font-size:12px}
    /* Drawer */
    .cv2-overlay{position:fixed;inset:0;background:rgba(20,25,40,.35);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
    .cv2-overlay.open{opacity:1;pointer-events:auto}
    .cv2-drawer{position:fixed;top:0;right:0;height:100vh;width:min(620px,94vw);background:var(--bg);z-index:51;transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(20,25,40,.2)}
    .cv2-drawer.open{transform:none}
    .cv2-dh{padding:20px 24px;background:var(--card);border-bottom:1px solid var(--line)}
    .cv2-dh .x{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
    .cv2-dh h2{margin:0 0 4px;font-size:18px}
    .cv2-comp{background:var(--pink-dim);border:1px solid #fbcfe8;border-radius:12px;padding:12px 14px;margin:16px 24px;font-size:13.5px;line-height:1.5}
    .cv2-comp .tag{font-size:10.5px;font-weight:700;color:var(--pink-dark);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px}
    .cv2-db{flex:1;overflow-y:auto;padding:0 24px 24px}
    .cv2-res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:13px}
    .cv2-res .rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .cv2-res .rname{font-weight:700}
    .cv2-res .rstd{font-size:12px;color:var(--muted);margin-top:3px}
    .cv2-res .self{font-size:11.5px;color:var(--muted);margin-top:6px}
    .cv2-levels{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
    .cv2-lvbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:600;font-size:12px;color:var(--muted)}
    .cv2-lvbtn.sel{border-color:var(--ink);background:var(--ink);color:#fff}
    .cv2-ev{width:100%;margin-top:9px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:12.5px;resize:vertical;min-height:38px}
    .cv2-global{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .cv2-global .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
    .cv2-df{padding:14px 24px;background:var(--card);border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
    .cv2-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 13px;font-size:12.5px;margin:0 24px 14px}
    /* Diagnostic */
    .cv2-diagres{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:14px}
    .cv2-diagres .dtitle{font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .cv2-fams{display:flex;flex-direction:column;gap:8px;margin:12px 0}
    .cv2-fam{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:.12s}
    .cv2-fam.sel{border-color:var(--pink);background:var(--pink-dim)}
    .cv2-fam .fh{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
    .cv2-fam .fh .bx{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--muted);flex-shrink:0}
    .cv2-fam.sel .fh .bx{background:var(--pink);border-color:var(--pink)}
    .cv2-fam .fd{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
    .cv2-caps{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
    .cv2-cap{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
    .cv2-cap:last-child{border-bottom:none}
    .cv2-cap .ct{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
    .cv2-cap .lvls{font-weight:700}
    .cv2-plan{margin-top:12px}
    .cv2-planitem{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:11px 13px;margin-bottom:9px;font-size:12.5px}
    .cv2-planitem b{color:var(--green-dark)}
    .cv2-noplan{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;border-radius:10px;padding:11px 13px;font-size:12.5px;margin-top:10px}
    .hidden{display:none!important}
    .cv2-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s}
    .cv2-toast.show{opacity:1}
  </style>
</head>
<body data-lang="{{ lang or 'fr' }}">
  <header>{% include 'header_buttons.html' %}</header>

  <div class="cv2-layout">
    <aside class="cv2-sidebar">
      <div class="cv2-mgr">
        <span class="dot"></span>
        <div><span class="lbl" data-i18n="manager">Manager</span><span class="nm" id="cv2-mgr-name">—</span></div>
      </div>
      <div class="cv2-sec-title" data-i18n="collaborators">Collaborateurs</div>
      <ul class="cv2-collab" id="cv2-collab"></ul>
      <p class="cv2-empty-side hidden" id="cv2-collab-empty" data-i18n="no_collab">Aucun collaborateur.</p>
    </aside>

    <main class="cv2-main">
      <h1 class="cv2-h1" data-i18n="title">Compétences</h1>
      <p class="cv2-sub" id="cv2-sub" data-i18n="pick_collab">Sélectionnez un collaborateur pour commencer.</p>
      <div class="cv2-roles" id="cv2-roles"></div>
      <div class="cv2-placeholder" id="cv2-placeholder" data-i18n="pick_collab2">Aucune donnée à afficher.</div>
      <div class="cv2-tablewrap hidden" id="cv2-tablewrap">
        <table class="cv2-tab">
          <thead><tr>
            <th data-i18n="c_activity">Activité</th>
            <th data-i18n="c_required">Niveau requis</th>
            <th data-i18n="c_demonstrated">Niveau démontré</th>
            <th data-i18n="c_gap">Écart</th>
            <th data-i18n="c_results">Résultats</th>
            <th data-i18n="c_last">Dernière éval.</th>
            <th></th>
          </tr></thead>
          <tbody id="cv2-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="cv2-overlay" id="cv2-overlay"></div>
  <aside class="cv2-drawer" id="cv2-drawer">
    <div class="cv2-dh">
      <button class="x" id="cv2-drawer-close">&times;</button>
      <h2 id="cv2-drawer-title">—</h2>
      <div class="cv2-sub" id="cv2-drawer-role" style="margin:0"></div>
    </div>
    <div class="cv2-comp hidden" id="cv2-comp"><span class="tag" data-i18n="competence">Compétence principale</span><span id="cv2-comp-text"></span></div>
    <div class="cv2-warn hidden" id="cv2-drawer-warn"></div>
    <div class="cv2-db" id="cv2-drawer-body"></div>
    <div class="cv2-df" id="cv2-footer"></div>
  </aside>

  <div class="cv2-toast" id="cv2-toast"></div>

  <script>window.OPTIQ_LANG = document.body.dataset.lang || 'fr';</script>
  <script src="/static/js/competences_v2.js"></script>
</body>
</html>
