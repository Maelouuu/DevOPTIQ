{% include "header_buttons.html" %}
<link rel="stylesheet" href="{{ url_for('static', filename='calendrier.css') }}">

<script>
  /* ⚠️ Injecté avec `| tojson`, jamais entre guillemets dans le script : le
     navigateur décode les entités HTML dans un ATTRIBUT, jamais dans un
     `<script>` — « c&#39;est » s'afficherait tel quel. */
  window.CAL_I18N = {
    lang:        {{ (session.get('lang') or 'fr') | tojson }},
    src_temps:   {{ t('cal.src_temps') | tojson }},
    src_comp:    {{ t('cal.src_comp') | tojson }},
    portee:      {{ t('cal.portee') | tojson }},
    p_tout:      {{ t('cal.p_tout') | tojson }},
    p_role:      {{ t('cal.p_role') | tojson }},
    p_personne:  {{ t('cal.p_personne') | tojson }},
    ch_role:     {{ t('cal.ch_role') | tojson }},
    ch_personne: {{ t('cal.ch_personne') | tojson }},
    mois_prec:   {{ t('cal.mois_prec') | tojson }},
    mois_suiv:   {{ t('cal.mois_suiv') | tojson }},
    aujourdhui:  {{ t('cal.aujourdhui') | tojson }},
    lun:         {{ t('cal.lun') | tojson }},
    mar:         {{ t('cal.mar') | tojson }},
    mer:         {{ t('cal.mer') | tojson }},
    jeu:         {{ t('cal.jeu') | tojson }},
    ven:         {{ t('cal.ven') | tojson }},
    sam:         {{ t('cal.sam') | tojson }},
    dim:         {{ t('cal.dim') | tojson }},
    bande_mois:  {{ t('cal.bande_mois') | tojson }},
    bande_sem:   {{ t('cal.bande_sem') | tojson }},
    r_mensuel:   {{ t('cal.r_mensuel') | tojson }},
    r_trimestriel: {{ t('cal.r_trimestriel') | tojson }},
    r_annuel:    {{ t('cal.r_annuel') | tojson }},
    r_inconnu:   {{ t('cal.r_inconnu') | tojson }},
    fois:        {{ t('cal.fois') | tojson }},
    charge_jour: {{ t('cal.charge_jour') | tojson }},
    leg_prevue:  {{ t('cal.leg_prevue') | tojson }},
    leg_retard:  {{ t('cal.leg_retard') | tojson }},
    leg_tenue:   {{ t('cal.leg_tenue') | tojson }},
    leg_creneau: {{ t('cal.leg_creneau') | tojson }},
    vide_mois:   {{ t('cal.vide_mois') | tojson }},
    vide_sem:    {{ t('cal.vide_sem') | tojson }},
    rien:        {{ t('cal.rien') | tojson }},
    erreur:      {{ t('cal.erreur') | tojson }},
    n_seances:   {{ t('cal.n_seances') | tojson }},
    n_seance:    {{ t('cal.n_seance') | tojson }},
    n_creneaux:  {{ t('cal.n_creneaux') | tojson }},
    n_creneau:   {{ t('cal.n_creneau') | tojson }}
  };
</script>
<script defer src="{{ url_for('static', filename='js/calendrier.js') }}"></script>

<div id="page-calendrier" class="container pg-root page--calendrier">

  {% with banner_page='calendrier', banner_icon='fa-regular fa-calendar-days',
          banner_title=t('page.calendrier') %}
    {% include "page_banner.html" %}
  {% endwith %}

  <div class="pg-container">

    <div class="cl-entete">
      <div class="cl-entete-txt">
        <h2 class="cl-h1">{{ t('cal.titre') }}</h2>
        <!-- ⚠️ La phrase qui dit POURQUOI une activité n'est pas sur un jour.
             Sans elle, on cherche le mardi où tombe « Chiffrer l'offre » —
             et il n'existe pas : une activité a un rythme, pas une date. -->
        <p class="cl-sous">{{ t('cal.sous') }}</p>
      </div>
    </div>

    <!-- Les deux sources : on les allume, on les éteint. Celle de la page
         d'où l'on vient est seule allumée à l'arrivée (`?de=temps|comp`). -->
    <div class="cl-barre">
      <div class="cl-sources" id="cl-sources"></div>
      <div class="cl-portee" id="cl-portee"></div>
    </div>

    <div class="cl-corps">
      <div class="cl-mois" id="cl-mois"></div>
      <aside class="cl-cote" id="cl-cote"></aside>
    </div>
  </div>
</div>
