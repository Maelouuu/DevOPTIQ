<!-- ============================================================
     QUI OUVRE QUELLES CARTOS — deux matrices : rôles × cartos et
     statuts × cartos.
     Les règles : Code/routes/carto_sharing.py (`/api/access/matrice`).
     L'écran : static/js/carto_acces.js — tout le texte passe par CACC_L.
     ============================================================ -->
<link rel="stylesheet" href="{{ url_for('static', filename='carto_acces.css') }}">
<script>
  /* ⚠️ `| tojson`, jamais une traduction entre guillemets dans un script : le
     navigateur ne décode pas les entités HTML ici. */
  window.CACC_L = {
    titre:        {{ t('map.acces_titre') | tojson }},
    role:         {{ t('map.acces_role') | tojson }},
    statut:       {{ t('map.acces_statut') | tojson }},
    sec_roles:    {{ t('map.acces_sec_roles') | tojson }},
    sec_statuts:  {{ t('map.acces_sec_statuts') | tojson }},
    tout_statut:  {{ t('map.acces_tout_statut') | tojson }},
    verrou:       {{ t('map.acces_verrou') | tojson }},
    filtre:       {{ t('map.acces_filtre') | tojson }},
    vide:         {{ t('map.acces_vide') | tojson }},
    aucune:       {{ t('map.acces_aucune') | tojson }},
    privee:       {{ t('map.acces_privee') | tojson }},
    ouverte:      {{ t('map.acces_ouverte') | tojson }},
    n_roles:      {{ t('map.acces_n_roles') | tojson }},
    n_statuts:    {{ t('map.acces_n_statuts') | tojson }},
    tout_carto:   {{ t('map.acces_tout_carto') | tojson }},
    tout_role:    {{ t('map.acces_tout_role') | tojson }},
    enregistre:   {{ t('map.acces_enregistre') | tojson }},
    commune_faite:{{ t('map.acces_commune_faite') | tojson }},
    err:          {{ t('map.acces_err') | tojson }},
    fermer:       {{ t('btn.close') | tojson }},
    lang:         {{ session.get('lang', 'fr') | tojson }}
  };
</script>
<script defer src="{{ url_for('static', filename='js/carto_acces.js') }}"></script>

<div class="cacc" id="cacc" hidden>
  <div class="cacc-fond" data-cacc="fermer"></div>
  <div class="cacc-boite" role="dialog" aria-modal="true" aria-labelledby="cacc-titre">
    <header class="cacc-tete">
      <span class="cacc-ic"><i class="fa-solid fa-user-lock"></i></span>
      <div>
        <h3 id="cacc-titre">{{ t('map.acces_titre') }}</h3>
      </div>
      <button type="button" class="cacc-x" data-cacc="fermer" aria-label="{{ t('btn.close') }}">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </header>
    <div class="cacc-barre">
      <div class="cacc-rech">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="cacc-q" placeholder="{{ t('map.acces_filtre') }}" autocomplete="off">
      </div>
    </div>
    <div class="cacc-corps" id="cacc-corps"></div>
  </div>
</div>
