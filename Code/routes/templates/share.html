{% include "header_buttons.html" %}
<link rel="stylesheet" href="{{ url_for('static', filename='share.css') }}">

    reasonAll:     {{ t('sharepage.reason_all') | tojson }},

    reachEmpty:    {{ t('sharepage.reach_empty') | tojson }},
    emptyMap:      {{ t('sharepage.empty_map') | tojson }},

    changesNoneCta:{{ t('sharepage.changes_none_cta') | tojson }},
    changeBy:      {{ t('change.by') | tojson }},
    changeMine:    {{ t('change.mine') | tojson }},
    statusPending: {{ t('change.status_pending') | tojson }},
    statusApproved:{{ t('change.status_approved') | tojson }},
    statusRejected:{{ t('change.status_rejected') | tojson }},

<script defer src="{{ url_for('static', filename='js/share.js') }}"></script>

<div class="pg-root page--share share-page">

  {% with banner_page='share', banner_icon='fa-solid fa-share-nodes',
          banner_title=t('page.share'), banner_sub=t('page.share_sub') %}
    {% include "page_banner.html" %}
  {% endwith %}

  <div class="pg-container sh-layout">

    <!-- ═══ Colonne gauche : la galerie des cartos ═══════════════════════
         Une liste déroulante ne dit rien de ce qu'on choisit. Ici on voit la
         carte elle-même — bandes et activités — avant de cliquer. -->
    <aside class="sh-gallery" id="sh-gallery">
      <div class="sh-gallery-head">
        <span class="sh-eyebrow">{{ t('sharepage.your_maps') }}</span>
      </div>
      <div class="sh-gallery-list" id="sh-gallery-list"></div>
    </aside>

    <!-- ═══ Colonne droite : la carto choisie ═══════════════════════════ -->
    <main class="sh-main" id="sh-main">
      <div class="sh-skeleton" id="sh-boot"><i class="fa-solid fa-spinner fa-spin"></i></div>
    </main>

  </div>
</div>

<!-- Sélecteur de comptes pour un rôle (rempli par share.js) -->
<div class="sh-overlay" id="sh-picker">
  <div class="sh-picker-card">
    <div class="sh-picker-head">
      <div class="sh-picker-title">
        <span class="sh-eyebrow" id="sh-picker-eyebrow">{{ t('sharepage.add_holder') }}</span>
        <strong id="sh-picker-role"></strong>
      </div>
      <button class="sh-x" id="sh-picker-close" aria-label="{{ t('btn.close') }}">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="sh-picker-body">
      <div class="sh-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="sh-picker-search">
      </div>
      <div id="sh-picker-list" class="sh-picker-list"></div>
    </div>
  </div>
</div>
