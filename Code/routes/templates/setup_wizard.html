<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OptiqFluent — Installation</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* ── DA OptiqFluent (reprise de la page de connexion) ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --pink:#ec4899; --pink-deep:#be185d; --green:#22c55e; --green-dk:#15803d; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh; position: relative; background: #1a2e1a;
  }
  .login-bg { position: fixed; inset: 0; z-index: 0; background-size: cover;
              background-position: center; }
  .login-bg-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.30); }

  .wizard-wrap { position: relative; z-index: 1; display: flex; align-items: flex-start;
                 justify-content: center; min-height: 100vh; padding: 40px 20px; }
  .wizard-card {
    background: #fff; border-radius: 28px; padding: 38px 44px 34px;
    width: 100%; max-width: 580px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 4px 20px rgba(0,0,0,.18), 0 24px 72px rgba(0,0,0,.36);
  }

  .login-logo { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .logo-icon { width: 50px; height: 50px; border-radius: 16px;
    background: linear-gradient(145deg, var(--pink) 0%, var(--pink-deep) 100%);
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-size: 22px; flex-shrink: 0; box-shadow: 0 4px 14px rgba(236,72,153,.38); }
  .logo-name { font-size: 1.4rem; font-weight: 800; color: #0f172a; letter-spacing: -.4px; line-height: 1.1; }
  .logo-tagline { font-size: .72rem; color: #94a3b8; margin-top: 3px; }
  .login-stripe { height: 3px; border-radius: 3px; margin-bottom: 20px; opacity: .8;
    background: linear-gradient(90deg, var(--pink-deep) 0%, var(--pink) 60%, #f9a8d4 100%); }

  /* Barre d'étapes */
  .steps { display: flex; gap: 6px; margin-bottom: 24px; }
  .steps span { flex: 1; height: 5px; border-radius: 3px; background: #f1f5f9; transition: background .25s; }
  .steps span.done { background: var(--green); }
  .steps span.cur { background: linear-gradient(90deg, var(--pink-deep), var(--pink)); }

  .step-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .step-ico { width: 38px; height: 38px; border-radius: 12px; background: #fdf2f8;
    color: var(--pink-deep); display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0; }
  .step-title { font-size: 1.3rem; font-weight: 800; color: #0f172a; letter-spacing: -.4px; }
  .step-opt { font-weight: 500; color: #94a3b8; font-size: .95rem; }
  .step-sub { color: #64748b; font-size: .875rem; line-height: 1.55; margin: 6px 0 18px; }
  .step-sub b { color: #374151; }

  .field-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field-label { font-size: .79rem; font-weight: 700; color: #374151;
                 text-transform: uppercase; letter-spacing: .7px; }
  .field-wrap { position: relative; display: flex; align-items: center; }
  .field-icon { position: absolute; left: 14px; color: #9ca3af; font-size: .82rem;
                pointer-events: none; z-index: 1; }
  .field-input, textarea.field-input {
    width: 100%; padding: 12px 14px 12px 40px; border: 1.5px solid #e5e7eb;
    border-radius: 11px; font-size: .94rem; color: #111827; background: #f9fafb;
    transition: border-color .18s, box-shadow .18s, background .18s; outline: none;
    font-family: inherit;
  }
  textarea.field-input { min-height: 120px; padding-left: 14px;
                         font-family: ui-monospace, monospace; font-size: .78rem; }
  .field-input:focus { border-color: var(--pink); background: #fff;
                       box-shadow: 0 0 0 3px rgba(236,72,153,.13); }
  .field-input::placeholder { color: #d1d5db; }
  .row { display: flex; gap: 12px; }
  .row .field-group { flex: 1; }
  .row .small { flex: 0 0 110px; }
  .hint { font-size: .76rem; color: #94a3b8; line-height: 1.45; }

  .btn-test { border: 1.5px solid #f9a8d4; background: #fdf2f8; color: var(--pink-deep);
    border-radius: 11px; padding: 10px 16px; font-size: .85rem; font-weight: 700;
    cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 8px;
    transition: all .15s; }
  .btn-test:hover { background: #fce7f3; }

  .flash-msg { display: none; align-items: flex-start; gap: 8px; padding: 10px 14px;
    border-radius: 10px; font-size: .855rem; font-weight: 500; margin-top: 12px; line-height: 1.4; }
  .flash-msg.on { display: flex; }
  .flash-error   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .flash-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  .flash-msg i { margin-top: 2px; }

  .btns { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
  .btn-login { padding: 13px 22px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    color: #fff; font-size: .96rem; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 18px rgba(236,72,153,.32); transition: all .18s;
    font-family: inherit; }
  .btn-login:hover { background: linear-gradient(135deg, #db2777 0%, #9d174d 100%);
    box-shadow: 0 6px 24px rgba(236,72,153,.44); transform: translateY(-1px); }
  .btn-back { padding: 13px 20px; border: 1.5px solid #e5e7eb; border-radius: 12px;
    background: #fff; color: #64748b; font-size: .92rem; font-weight: 600; cursor: pointer;
    font-family: inherit; display: inline-flex; align-items: center; gap: 8px; transition: all .15s; }
  .btn-back:hover:not(:disabled) { border-color: #cbd5e1; color: #374151; }
  .btn-back:disabled { opacity: .45; cursor: default; }

  .recap { font-size: .9rem; line-height: 2.1; color: #374151; }
  .recap i.fa-circle-check { color: var(--green); }
  .recap i.fa-circle-minus { color: #cbd5e1; }
  .recap i.fa-triangle-exclamation { color: #f59e0b; }
  .recap code { font-size: .74rem; background: #f9fafb; border: 1px solid #e5e7eb;
                border-radius: 6px; padding: 2px 6px; color: #64748b; }

  #overlay { position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,.45);
    backdrop-filter: blur(8px); }
  .overlay-card { background: #fff; border-radius: 24px; padding: 42px 48px;
    text-align: center; max-width: 420px;
    box-shadow: 0 24px 72px rgba(0,0,0,.4); }
  .spin { width: 46px; height: 46px; border: 4px solid #fce7f3; border-top-color: var(--pink-deep);
    border-radius: 50%; margin: 0 auto 20px; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  .overlay-card h2 { color: #0f172a; font-size: 1.25rem; font-weight: 800; letter-spacing: -.3px; }
  .overlay-card p { color: #64748b; font-size: .875rem; margin-top: 8px; line-height: 1.55; }
</style>
</head>
<body>

  <div class="login-bg" style="background-image: url('{{ url_for('static', filename='img/jungle.jpg') }}')" aria-hidden="true">
    <div class="login-bg-overlay"></div>
  </div>

  <div class="wizard-wrap">
    <div class="wizard-card">
      <div class="login-logo">
        <div class="logo-icon"><i class="fa-solid fa-diagram-project"></i></div>
        <div>
          <div class="logo-name">OptiqFluent</div>
          <div class="logo-tagline">Assistant d'installation</div>
        </div>
      </div>
      <div class="login-stripe"></div>
      <div class="steps" id="stepbar"></div>
      <div id="card"></div>
    </div>
  </div>

  <div id="overlay">
    <div class="overlay-card">
      <div class="spin"></div>
      <h2>Installation en cours…</h2>
      <p>L'application redémarre avec votre configuration.<br>
         Vous serez redirigé vers la page de connexion automatiquement.</p>
    </div>
  </div>

<script>
const LICENSE = {{ license_status | tojson }};
const DB_DEFAULT = {{ db_default | tojson }};
const MAIL_SERVER_DEFAULT = {{ mail_server_default | tojson }};

const state = { license_ok: LICENSE.valid, db_url: DB_DEFAULT, db_ok: false,
                openai_key: "", mail: {}, admin: {} };

const steps = [];
if (LICENSE.required) steps.push("licence");
steps.push("db", "openai", "mail", "admin", "recap");
let cur = 0;

const $ = s => document.querySelector(s);
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };

function bar() {
  $("#stepbar").innerHTML = steps.map((s,i) =>
    `<span class="${i<cur?'done':i===cur?'cur':''}"></span>`).join("");
}

async function api(path, body) {
  const r = await fetch("/setup/api/" + path, { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}
function show(el, ok, text) {
  el.className = "flash-msg on " + (ok ? "flash-success" : "flash-error");
  el.innerHTML = `<i class="fa-solid fa-${ok?'circle-check':'circle-xmark'}"></i><span>${esc(text)}</span>`;
}

function head(icon, title, opt) {
  return `<div class="step-head">
            <div class="step-ico"><i class="fa-solid fa-${icon}"></i></div>
            <div class="step-title">${title}${opt?' <span class="step-opt">(facultatif)</span>':''}</div>
          </div>`;
}

const render = {
  licence() { return head("key", "Licence d'utilisation") + `
    <div class="step-sub">Collez le contenu du fichier <b>optiqfluent.lic</b> fourni par AFDEC
      (ouvrez-le avec un éditeur de texte, sélectionnez tout, copiez).</div>
    ${LICENSE.valid
      ? `<div class="flash-msg on flash-success"><i class="fa-solid fa-circle-check"></i>
         <span>Licence déjà installée : ${esc(LICENSE.licensee)} — valide jusqu'au ${esc(LICENSE.expires_at)}.</span></div>`
      : `<textarea id="lic" class="field-input" placeholder='{"payload": {...}, "signature": "..."}'></textarea>
         <button class="btn-test" style="margin-top:12px" onclick="doLicense()">
           <i class="fa-solid fa-shield-halved"></i> Valider la licence</button>`}
    <div class="flash-msg" id="m"></div>`;
  },
  db() { return head("database", "Base de données") + `
    <div class="step-sub">Installation standard (base PostgreSQL intégrée) :
      <b>laissez la valeur pré-remplie</b>. Si votre entreprise fournit sa propre base
      PostgreSQL, indiquez son URL de connexion.</div>
    <div class="field-group">
      <label class="field-label">URL de connexion PostgreSQL</label>
      <div class="field-wrap">
        <i class="fa-solid fa-database field-icon"></i>
        <input id="dburl" class="field-input" value="${esc(state.db_url)}"
               placeholder="postgresql://utilisateur:motdepasse@hote:5432/base">
      </div>
      <div class="hint">Les tables seront créées automatiquement — la base doit simplement
        exister et être vide (ou déjà OptiqFluent).</div>
    </div>
    <button class="btn-test" onclick="doDb()"><i class="fa-solid fa-plug-circle-check"></i> Tester la connexion</button>
    <div class="flash-msg" id="m"></div>`;
  },
  openai() { return head("wand-magic-sparkles", "Intelligence artificielle") + `
    <div class="step-sub">Les fonctions IA (assistant, propositions de compétences, imports)
      utilisent l'API OpenAI avec la clé de votre entreprise : créez-la sur
      <b>platform.openai.com</b> (API keys), avec un plafond de dépense recommandé.
      Vous pourrez l'ajouter plus tard, mais les fonctions IA seront limitées d'ici là.</div>
    <div class="field-group">
      <label class="field-label">Clé API OpenAI</label>
      <div class="field-wrap">
        <i class="fa-solid fa-key field-icon"></i>
        <input id="oaikey" class="field-input" value="${esc(state.openai_key)}" placeholder="sk-...">
      </div>
    </div>
    <button class="btn-test" onclick="doOpenai()"><i class="fa-solid fa-vial-circle-check"></i> Tester la clé</button>
    <div class="flash-msg" id="m"></div>`;
  },
  mail() { return head("envelope", "Envoi d'emails", true) + `
    <div class="step-sub">Sert uniquement au « mot de passe oublié ». Avec un compte Google :
      activez la validation en deux étapes puis créez un <b>mot de passe d'application</b>
      (myaccount.google.com/apppasswords) — c'est lui qu'il faut saisir ici.
      Vous pouvez passer cette étape.</div>
    <div class="row">
      <div class="field-group">
        <label class="field-label">Serveur SMTP</label>
        <div class="field-wrap"><i class="fa-solid fa-server field-icon"></i>
          <input id="mserver" class="field-input" value="${esc(state.mail.server || MAIL_SERVER_DEFAULT)}"></div>
      </div>
      <div class="field-group small">
        <label class="field-label">Port</label>
        <div class="field-wrap" style="padding-left:0">
          <input id="mport" class="field-input" style="padding-left:14px" value="${esc(state.mail.port || 587)}"></div>
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Adresse d'envoi</label>
      <div class="field-wrap"><i class="fa-solid fa-envelope field-icon"></i>
        <input id="muser" class="field-input" value="${esc(state.mail.username||'')}"
               placeholder="notifications@votre-entreprise.fr"></div>
    </div>
    <div class="field-group">
      <label class="field-label">Mot de passe d'application</label>
      <div class="field-wrap"><i class="fa-solid fa-lock field-icon"></i>
        <input id="mpwd" type="password" class="field-input" value="${esc(state.mail.password||'')}"
               placeholder="••••••••"></div>
    </div>
    <button class="btn-test" onclick="doMail()"><i class="fa-solid fa-paper-plane"></i> Tester l'envoi</button>
    <div class="flash-msg" id="m"></div>`;
  },
  admin() { return head("user-shield", "Compte administrateur") + `
    <div class="step-sub">Le premier compte de l'application : il servira à créer les autres
      utilisateurs. Choisissez un mot de passe fort (8 caractères minimum).</div>
    <div class="row">
      <div class="field-group">
        <label class="field-label">Prénom</label>
        <div class="field-wrap"><i class="fa-solid fa-user field-icon"></i>
          <input id="afn" class="field-input" value="${esc(state.admin.first_name||'')}"></div>
      </div>
      <div class="field-group">
        <label class="field-label">Nom</label>
        <div class="field-wrap"><i class="fa-solid fa-user field-icon"></i>
          <input id="aln" class="field-input" value="${esc(state.admin.last_name||'')}"></div>
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Email</label>
      <div class="field-wrap"><i class="fa-solid fa-envelope field-icon"></i>
        <input id="aem" class="field-input" value="${esc(state.admin.email||'')}"
               placeholder="admin@votre-entreprise.fr"></div>
    </div>
    <div class="row">
      <div class="field-group">
        <label class="field-label">Mot de passe</label>
        <div class="field-wrap"><i class="fa-solid fa-lock field-icon"></i>
          <input id="apw" type="password" class="field-input" value="${esc(state.admin.password||'')}"
                 placeholder="••••••••"></div>
      </div>
      <div class="field-group">
        <label class="field-label">Confirmation</label>
        <div class="field-wrap"><i class="fa-solid fa-lock field-icon"></i>
          <input id="apw2" type="password" class="field-input" placeholder="••••••••"></div>
      </div>
    </div>
    <div class="flash-msg" id="m"></div>`;
  },
  recap() { return head("clipboard-check", "Récapitulatif") + `
    <div class="step-sub">Vérifiez puis lancez l'installation — l'application redémarre avec
      cette configuration (une trentaine de secondes).</div>
    <div class="recap">
      ${LICENSE.required?`<div><i class="fa-solid fa-${state.license_ok?'circle-check':'triangle-exclamation'}"></i>
         <b>Licence</b> : ${state.license_ok?esc(LICENSE.licensee)+" — jusqu'au "+esc(LICENSE.expires_at):'manquante'}</div>`:''}
      <div><i class="fa-solid fa-${state.db_ok?'circle-check':'triangle-exclamation'}"></i>
        <b>Base de données</b> ${state.db_ok?'— connexion vérifiée':'— non testée'}
        <code>${esc(state.db_url.replace(/:\/\/([^:]+):[^@]*@/,'://$1:•••@'))}</code></div>
      <div><i class="fa-solid fa-${state.openai_key?'circle-check':'circle-minus'}"></i>
        <b>Clé OpenAI</b> ${state.openai_key?'— renseignée':'— aucune (fonctions IA limitées)'}</div>
      <div><i class="fa-solid fa-${state.mail.username?'circle-check':'circle-minus'}"></i>
        <b>Email</b> ${state.mail.username?'— '+esc(state.mail.username):'— non configuré (reset de mot de passe désactivé)'}</div>
      <div><i class="fa-solid fa-circle-check"></i>
        <b>Administrateur</b> — ${esc(state.admin.email)}</div>
    </div>
    <div class="flash-msg" id="m"></div>`;
  },
};

function draw() {
  bar();
  $("#card").innerHTML = render[steps[cur]]() + `
    <div class="btns">
      <button class="btn-back" onclick="prev()" ${cur===0?'disabled':''}>
        <i class="fa-solid fa-arrow-left"></i> Retour</button>
      ${steps[cur]==='recap'
        ? `<button class="btn-login" onclick="finish()"><i class="fa-solid fa-rocket"></i> Installer</button>`
        : `<button class="btn-login" onclick="next()">Continuer <i class="fa-solid fa-arrow-right"></i></button>`}
    </div>`;
}
function prev() { if (cur>0) { cur--; draw(); } }

function collect() {
  const s = steps[cur];
  if (s==='db') state.db_url = $("#dburl").value.trim();
  if (s==='openai') state.openai_key = $("#oaikey").value.trim();
  if (s==='mail') state.mail = { server:$("#mserver").value.trim(), port:$("#mport").value.trim(),
                                 username:$("#muser").value.trim(), password:$("#mpwd").value };
  if (s==='admin') state.admin = { first_name:$("#afn").value, last_name:$("#aln").value,
                                   email:$("#aem").value.trim(), password:$("#apw").value };
}

function next() {
  collect();
  const s = steps[cur];
  if (s==='licence' && !state.license_ok)
    return show($("#m"), false, "Validez d'abord votre licence pour continuer.");
  if (s==='db' && !state.db_url)
    return show($("#m"), false, "Renseignez l'URL de la base de données.");
  if (s==='admin') {
    if (!/^[^@]+@[^@]+\.[^@]+$/.test(state.admin.email))
      return show($("#m"), false, "Email administrateur invalide.");
    if (state.admin.password.length < 8)
      return show($("#m"), false, "Mot de passe trop court (8 caractères minimum).");
    if (state.admin.password !== $("#apw2").value)
      return show($("#m"), false, "Les deux mots de passe ne correspondent pas.");
  }
  cur++; draw();
}

async function doLicense() {
  const r = await api("license", { content: $("#lic").value });
  if (r.ok) { state.license_ok = true; LICENSE.valid = true;
              LICENSE.licensee = r.licensee; LICENSE.expires_at = r.expires_at; draw();
              show($("#m"), true, `Licence valide : ${r.licensee} — jusqu'au ${r.expires_at}.`); }
  else show($("#m"), false, r.error);
}
async function doDb() {
  collect();
  show($("#m"), true, "Test en cours…");
  const r = await api("test-db", { url: state.db_url });
  state.db_ok = r.ok;
  show($("#m"), r.ok, r.ok ? "Connexion réussie." : r.error);
}
async function doOpenai() {
  collect();
  show($("#m"), true, "Test en cours…");
  const r = await api("test-openai", { key: state.openai_key });
  show($("#m"), r.ok, r.ok ? "Clé valide." : r.error);
}
async function doMail() {
  collect();
  show($("#m"), true, "Test en cours…");
  const r = await api("test-mail", state.mail);
  show($("#m"), r.ok, r.ok ? "Connexion SMTP réussie." : r.error);
}

async function finish() {
  const r = await api("finish", { database_url: state.db_url, openai_key: state.openai_key,
                                  mail: state.mail, admin: state.admin });
  if (!r.ok) return show($("#m"), false, r.error);
  $("#overlay").style.display = "flex";
  if (!r.restarting) { setTimeout(() => location.href = "/", 2500); return; }
  const poll = setInterval(async () => {
    try {
      const p = await fetch("/setup/ping");
      if (p.status === 404) {
        const h = await fetch("/healthz");
        if (h.ok) { clearInterval(poll); location.href = "/"; }
      }
    } catch (e) { /* redémarrage en cours */ }
  }, 2000);
}

draw();
</script>
</body>
</html>
