<!-- header_buttons.html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='optiq.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='ui-theme.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='cardnav.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<div class="card-nav-container">
  <nav id="card-nav" class="card-nav" aria-label="Navigation principale">

    <!-- Logo cercle translucide -->
    <a class="logo-container" href="/activities/map" title="OPTIQ">
      <div class="logo-circle">
        <svg viewBox="0 0 32 32" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="15" cy="15" r="11" stroke="#ffffff" stroke-width="1.8" opacity="0.95"/>
          <circle cx="15" cy="15" r="8"  stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>
          <circle cx="15" cy="15" r="5"  stroke="#ffffff" stroke-width="1.5" opacity="0.55"/>
          <circle cx="15" cy="15" r="2.5" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
          <line x1="22" y1="22" x2="28" y2="28" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </a>

    <!-- Hamburger (mobile uniquement) -->
    <div id="hamburger" class="hamburger-menu" role="button"
         aria-label="Ouvrir le menu" tabindex="0">
      <div class="hamburger-line"></div>
      <div class="hamburger-line"></div>
    </div>

    <!-- Items de navigation — même ordre que le guide utilisateur :
         Cartographie en premier (elle pilote l'app), Paramètres en dernier -->
    <div class="card-nav-content" aria-hidden="false">
      <div class="card-scroll">

        <a class="nav-card" href="/activities/map"
           style="--ic-c: #0d9488; --glow: rgba(13,148,136,0.5)">
          <span class="nav-card-icon"><i class="fa-solid fa-diagram-project"></i></span>
          <span class="nav-card-label">{{ t('nav.carto') }}</span>
        </a>

        <a class="nav-card" href="/activities/view"
           style="--ic-c: #7c3aed; --glow: rgba(124,58,237,0.5)">
          <span class="nav-card-icon"><i class="fa-solid fa-list-check"></i></span>
          <span class="nav-card-label">{{ t('nav.activities') }}</span>
        </a>

        <a class="nav-card" href="/roles_view"
           style="--ic-c: #059669; --glow: rgba(5,150,105,0.5)">
          <span class="nav-card-icon"><i class="fa-solid fa-users-rectangle"></i></span>
          <span class="nav-card-label">{{ t('nav.roles') }}</span>
        </a>

        <a class="nav-card" href="/competences/view"
           style="--ic-c: #2563eb; --glow: rgba(37,99,235,0.5)">
          <span class="nav-card-icon"><i class="fa-solid fa-layer-group"></i></span>
          <span class="nav-card-label">{{ t('nav.competences') }}</span>
        </a>

        <a class="nav-card" href="/temps"
           style="--ic-c: #d97706; --glow: rgba(217,119,6,0.5)">
          <span class="nav-card-icon"><i class="fa-solid fa-clock"></i></span>
          <span class="nav-card-label">{{ t('nav.time') }}</span>
        </a>

        <a class="nav-card" href="/comptes"
           style="--ic-c: #e11d48; --glow: rgba(225,29,72,0.5)">
          <span class="nav-card-icon"><i class="fa-solid fa-users-gear"></i></span>
          <span class="nav-card-label">{{ t('nav.accounts') }}</span>
        </a>

        <a class="nav-card" href="/gestion_rh"
           style="--ic-c: #16a34a; --glow: rgba(22,163,74,0.5)">
          <span class="nav-card-icon"><i class="fa-solid fa-building-user"></i></span>
          <span class="nav-card-label">{{ t('nav.hr') }}</span>
        </a>

        <a class="nav-card" href="/gestion_outils"
           style="--ic-c: #ea580c; --glow: rgba(234,88,12,0.5)">
          <span class="nav-card-icon"><i class="fa-solid fa-screwdriver-wrench"></i></span>
          <span class="nav-card-label">{{ t('nav.tools') }}</span>
        </a>

        <a class="nav-card" href="/parametres"
           style="--ic-c: #6366f1; --glow: rgba(99,102,241,0.5)">
          <span class="nav-card-icon"><i class="fa-solid fa-gear"></i></span>
          <span class="nav-card-label">{{ t('nav.settings') }}</span>
        </a>

      </div>

      <!-- Liseré de défilement : la nav défile horizontalement, mais sans
           trackpad rien ne permettait de la faire glisser. Discret au repos,
           il apparaît au survol et pendant le défilement — et il se tire. -->
      <div class="card-scrollbar" id="card-scrollbar" aria-hidden="true">
        <div class="card-scrollbar-thumb"></div>
      </div>
    </div>

    <!-- Déconnexion -->
    <a href="/logout" class="logout-btn" title="{{ t('nav.logout') }}">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>{{ t('nav.logout') }}</span>
    </a>

  </nav>
</div>

<script src="{{ url_for('static', filename='js/cardnav.js') }}"></script>
<script src="{{ url_for('static', filename='js/pulse.js') }}" defer></script>
