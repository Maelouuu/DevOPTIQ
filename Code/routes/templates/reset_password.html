<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptiqFluent — {{ t('reset_pwd.page_title') }}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='connexion.css') }}">
  <style>
    /* Styles spécifiques reset password */
    .rp-card {
      max-width: 420px;
      width: 100%;
    }

    .rp-email-hint {
      font-size: 0.82rem;
      color: #6b7280;
      text-align: center;
      margin-bottom: 18px;
      padding: 8px 14px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
    }

    .rp-email-hint strong {
      color: #16a34a;
    }

    .rp-rules {
      font-size: 0.78rem;
      color: #9ca3af;
      margin-top: 6px;
      margin-bottom: 0;
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .rp-rules li::before {
      content: '•';
      margin-right: 6px;
      color: #d1d5db;
    }

    .pw-strength {
      height: 4px;
      border-radius: 2px;
      margin-top: 6px;
      background: #e5e7eb;
      overflow: hidden;
    }

    .pw-strength-bar {
      height: 100%;
      border-radius: 2px;
      width: 0;
      transition: width 0.3s, background 0.3s;
    }

    .error-banner {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.84rem;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <div class="login-bg" style="background-image: url('{{ url_for('static', filename='img/jungle.jpg') }}')" aria-hidden="true">
    <div class="login-bg-overlay"></div>
  </div>

  <div class="login-wrap">
    <div class="login-card rp-card">

      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-icon">
          <i class="fa-solid fa-diagram-project"></i>
        </div>
        <div>
          <div class="logo-name">OptiqFluent</div>
          <div class="logo-tagline">{{ t('login.tagline') }}</div>
        </div>
      </div>

      <div class="login-stripe"></div>

      <div style="text-align:center;margin-bottom:6px">
        <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ec4899,#be185d);display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px">
          <i class="fa-solid fa-lock-open" style="color:#fff;font-size:20px"></i>
        </div>
        <h1 class="login-title" style="margin:0">{{ t('reset_pwd.heading') }}</h1>
      </div>

      {% if email %}
      <p class="rp-email-hint">
        Compte : <strong>{{ email }}</strong>
      </p>
      {% endif %}

      {% if error %}
      <div class="error-banner">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" class="login-form" novalidate id="rp-form"
        data-err-short="{{ t('reset_pwd.err_too_short') }}"
        data-err-mismatch="{{ t('reset_pwd.err_mismatch') }}">
        <div class="field-group">
          <label class="field-label" for="rp-password">{{ t('reset_pwd.label_new') }}</label>
          <div class="field-wrap">
            <i class="fa-solid fa-lock field-icon"></i>
            <input type="password" id="rp-password" name="password"
              class="field-input" placeholder="••••••••"
              required autocomplete="new-password" minlength="6">
            <button type="button" class="field-eye" id="toggle-pwd" tabindex="-1">
              <i class="fa-solid fa-eye" id="eye-icon-1"></i>
            </button>
          </div>
          <div class="pw-strength"><div class="pw-strength-bar" id="pw-bar"></div></div>
          <ul class="rp-rules">
            <li>{{ t('reset_pwd.rule_min') }}</li>
          </ul>
        </div>

        <div class="field-group">
          <label class="field-label" for="rp-confirm">{{ t('reset_pwd.label_confirm') }}</label>
          <div class="field-wrap">
            <i class="fa-solid fa-lock field-icon"></i>
            <input type="password" id="rp-confirm" name="confirm_password"
              class="field-input" placeholder="••••••••"
              required autocomplete="new-password">
            <button type="button" class="field-eye" id="toggle-confirm" tabindex="-1">
              <i class="fa-solid fa-eye" id="eye-icon-2"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="rp-submit">
          <i class="fa-solid fa-check"></i>
          {{ t('reset_pwd.submit') }}
        </button>
      </form>

      <p class="forgot-wrap">
        <a href="{{ url_for('auth.login') }}" class="forgot-link">
          <i class="fa-solid fa-arrow-left" style="font-size:0.75em;margin-right:4px"></i>
          {{ t('reset_pwd.back') }}
        </a>
      </p>

    </div>
  </div>

  <script>
  (function() {
    // Toggle visibilité mot de passe
    function toggleVisibility(btnId, inputId, iconId) {
      document.getElementById(btnId)?.addEventListener('click', () => {
        const input = document.getElementById(inputId);
        const icon  = document.getElementById(iconId);
        if (!input) return;
        const show = input.type === 'password';
        input.type     = show ? 'text' : 'password';
        if (icon) icon.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
      });
    }
    toggleVisibility('toggle-pwd',     'rp-password', 'eye-icon-1');
    toggleVisibility('toggle-confirm', 'rp-confirm',  'eye-icon-2');

    // Indicateur de force du mot de passe
    const pwInput = document.getElementById('rp-password');
    const pwBar   = document.getElementById('pw-bar');
    if (pwInput && pwBar) {
      pwInput.addEventListener('input', () => {
        const v = pwInput.value;
        let score = 0;
        if (v.length >= 6)  score++;
        if (v.length >= 10) score++;
        if (/[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
        const widths = ['25%', '50%', '75%', '100%'];
        pwBar.style.width      = v.length ? widths[score] || '100%' : '0';
        pwBar.style.background = v.length ? colors[score] || '#22c55e' : '';
      });
    }

    // Validation côté client avant soumission
    const rpForm = document.getElementById('rp-form');
    rpForm?.addEventListener('submit', (e) => {
      const pwd     = document.getElementById('rp-password')?.value || '';
      const confirm = document.getElementById('rp-confirm')?.value || '';
      if (pwd.length < 6) {
        e.preventDefault();
        alert(rpForm.dataset.errShort);
        return;
      }
      if (pwd !== confirm) {
        e.preventDefault();
        alert(rpForm.dataset.errMismatch);
      }
    });
  })();
  </script>

</body>
</html>
